<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankraixmotion Premium</title>
    <style>
        body { background-color: #0f0f0f; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { max-width: 400px; width: 100%; background: #1a1a1a; padding: 25px; border-radius: 10px; border: 1px solid #333; }
        h2 { margin-top: 0; color: #4ade80; font-size: 22px; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
        label { font-size: 14px; color: #ccc; display: block; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #4ade80; color: #000; border: none; font-weight: bold; font-size: 15px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:disabled { background: #555; cursor: not-allowed; }
        .result { margin-top: 15px; padding: 12px; border-radius: 5px; font-size: 13px; display: none; line-height: 1.4; word-wrap: break-word; }
        .success { background: #064e3b; border: 1px solid #10b981; color: #a7f3d0; }
        .error { background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; }
        .divider { border-top: 1px dashed #444; margin: 25px 0; }
        .footer { text-align: center; margin-top: 25px; font-size: 11px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ankraixmotion / Activate</h2>
        <div class="subtitle">Ankraixmotion Premium — Magic Link Activation</div>
        
        <!-- BAGIAN 1: KIRIM EMAIL -->
        <label>1. Masukkan Email</label>
        <input type="email" id="email" placeholder="ankraixmotion@gmail.com" required>
        <button onclick="kirimLink()" id="btnKirim">Kirim Link Aktivasi →</button>
        <div id="hasilKirim" class="result"></div>

        <div class="divider"></div>

        <!-- BAGIAN 2: VERIFIKASI LINK -->
        <label>2. Tempel Link dari Email</label>
        <input type="text" id="linkVerifikasi" placeholder="https://... atau oobCode" required>
        <button onclick="verifikasiLink()" id="btnVerifikasi">Verifikasi Link →</button>
        <div id="hasilVerifikasi" class="result"></div>
        
        <div class="footer">Unofficial · Reverse Engineered · Use at your own risk</div>
    </div>

    <script>
        // Fungsi untuk Kirim Link
        async function kirimLink() {
            const email = document.getElementById('email').value;
            const hasil = document.getElementById('hasilKirim');
            const btn = document.getElementById('btnKirim');
            
            if(!email) return alert('Masukkan email yang valid!');

            btn.innerText = 'Mengirim...'; btn.disabled = true; hasil.style.display = 'none';

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });
                const data = await response.json();
                
                hasil.className = 'result ' + (data.success ? 'success' : 'error');
                hasil.innerHTML = data.success 
                    ? '✅ <b>Berhasil!</b><br>Link dikirim ke <b>' + email + '</b>. Cek Inbox/Spam, lalu salin link-nya ke kolom nomor 2 di bawah.'
                    : '❌ Gagal: ' + (data.message || 'Terjadi kesalahan.');
                hasil.style.display = 'block';
            } catch (error) {
                hasil.className = 'result error'; hasil.innerText = '❌ Gagal menghubungi server.'; hasil.style.display = 'block';
            } finally {
                btn.innerText = 'Kirim Link Aktivasi →'; btn.disabled = false;
            }
        }

        // Fungsi untuk Verifikasi Link
        async function verifikasiLink() {
            const email = document.getElementById('email').value;
            const link = document.getElementById('linkVerifikasi').value;
            const hasil = document.getElementById('hasilVerifikasi');
            const btn = document.getElementById('btnVerifikasi');
            
            if(!email || !link) return alert('Email dan Link harus diisi!');

            btn.innerText = 'Memverifikasi...'; btn.disabled = true; hasil.style.display = 'none';

            try {
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, link: link })
                });
                const data = await response.json();
                
                if(data.success) {
                    hasil.className = 'result success';
                    hasil.innerHTML = '✅ <b>PREMIUM AKTIF!</b><br>Email: ' + (data.data?.email || email) + '<br>Status: Berhasil diverifikasi.';
                } else {
                    hasil.className = 'result error';
                    hasil.innerText = '❌ Gagal Verifikasi: ' + (data.message || 'Link tidak valid / kadaluarsa.');
                }
                hasil.style.display = 'block';
            } catch (error) {
                hasil.className = 'result error'; hasil.innerText = '❌ Gagal menghubungi server verifikasi.'; hasil.style.display = 'block';
            } finally {
                btn.innerText = 'Verifikasi Link →'; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
